name: update data
on: {schedule: [{cron: "*/15 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.12"}}, {run: python scripts/build_data.py, env: {NOTION_TOKEN: "${{ secrets.NOTION_TOKEN }}", TZ: Europe/Madrid}}, {run: "git config user.name larry-today-bot && git config user.email bot@users.noreply.github.com && git add data.json && (git diff --cached --quiet || git commit -m data) && git push"}]}}
